services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: sicamp
      POSTGRES_USER: sicamp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sicamp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicamp -d sicamp"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sicamp:${POSTGRES_PASSWORD:-sicamp}@db:5432/sicamp
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://llm-gateway.sicamp.ru/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-nebius/deepseek-ai/DeepSeek-V4-Pro}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-12000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
